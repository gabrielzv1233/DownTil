[project]
name = "downtil"
version = "2.0.0"
description = "Minimal YouTube, TikTok, and SoundCloud media downloader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "yt-dlp>=2025.1.1",
    "requests>=2.32",
    "mutagen>=1.47",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
